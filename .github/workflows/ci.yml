# The release gate. Nothing reaches tripcash.app that has not passed it.
#
# It used to run the unit tests only, after the push, advisorily — while
# GitHub Pages deployed straight off the branch whether CI was red or green.
# So the three suites the process claimed were mandatory were in fact
# invoked by hand, on one laptop, by the same actor that had already skipped
# them once and shipped mid-review.
#
# Now the deploy job cannot start until unit tests, rules tests and
# preflight have all passed here. Discipline is not required and is not
# accepted as a substitute.
#
# The repository's Pages source was switched to "GitHub Actions" on
# 10 Aug 2026; before that it deployed from the branch and this workflow was
# decorative. Verified end to end after the switch: the site still serves
# v1.70.0 / cache v96 on the custom domain with the HTTP→HTTPS redirect
# intact. If Pages is ever set back to "Deploy from a branch", every check
# below becomes advisory again without anything failing to say so.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Let a newer push supersede an in-flight one, but never cancel a deploy
# half-way: a partially published site is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Locale-pinned deliberately: this suite has caught currency-parsing
      # bugs that only appear in comma-decimal locales, and an unpinned
      # runner would hide them.
      #
      # No install step and none needed — the suite uses node builtins only.
      # tests/fold.test.mjs measures the landing screen in headless Chrome,
      # which this image ships (`/usr/bin/google-chrome`); it skips if the
      # image ever stops shipping one, and the preflight job below then
      # fails rather than letting the storefront ship on an unmeasured fold.
      - run: npm test

  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow clone. rollout.test.mjs reads
      # docs/deployed-baseline.txt, which names the exact commits currently
      # live — deliberately old ones, because the point is to compare a new
      # release against what real devices are still running. A shallow clone
      # does not contain them and the test cannot run at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The emulator is a JVM process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # No package-lock.json in the repo — `npm ci` requires one and this
      # project has never had dependencies worth pinning at runtime
      # (ADR-0001). devDependencies are the emulator harness only.
      - run: npm install --no-audit --no-fund
      - run: npm run test:rules

  preflight:
    name: Release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      # preflight compares this commit against the one before it to decide
      # whether the service-worker cache version moved, so it needs history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Check 8 reads the repository's Pages build_type to confirm this gate
      # is still wired to the deploy at all.
      - run: npm run preflight
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: Deploy to tripcash.app
    needs: [unit, rules, preflight]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # No build step by design (ADR-0001) — the repository is the site.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
